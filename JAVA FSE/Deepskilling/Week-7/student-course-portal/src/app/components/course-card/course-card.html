<div class="course-card">
  <h3>{{ course.name }}</h3>

  <p><strong>Code:</strong> {{ course.code }}</p>
  <p><strong>Credits:</strong> {{ course.credits | creditLabel }}</p>
  <p><strong>Status:</strong> {{ course.gradeStatus }}</p>

  <ng-container *ngIf="enrolledIds$ | async as enrolledIds">

    <button
      *ngIf="!enrolledIds.includes(course.id)"
      (click)="enroll()">
      Enroll
    </button>

    <button
      *ngIf="enrolledIds.includes(course.id)"
      (click)="unenroll()">
      Unenroll
    </button>

  </ng-container>
</div>
