<form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">

    <div>
      <label>Student Name:</label><br>
      <input type="text" formControlName="studentName">
  
      <div *ngIf="enrollForm.get('studentName')?.touched &&
                  enrollForm.get('studentName')?.hasError('required')">
        Name is required
      </div>
  
      <div *ngIf="enrollForm.get('studentName')?.touched &&
                  enrollForm.get('studentName')?.hasError('minlength')">
        Name must be at least 3 characters
      </div>
    </div>
  
    <br>
  
    <div>
      <label>Email:</label><br>
      <input type="email" formControlName="studentEmail">
  
      <div *ngIf="enrollForm.get('studentEmail')?.touched &&
                  enrollForm.get('studentEmail')?.hasError('required')">
        Email is required
      </div>
  
      <div *ngIf="enrollForm.get('studentEmail')?.touched &&
                  enrollForm.get('studentEmail')?.hasError('email')">
        Enter a valid email
      </div>
  
      <div *ngIf="enrollForm.get('studentEmail')?.hasError('emailTaken')">
        Email already taken.
      </div>
    </div>
  
    <br>
  
    <div>
      <label>Course ID:</label><br>
      <input type="text" formControlName="courseId">
  
      <div *ngIf="enrollForm.get('courseId')?.touched &&
                  enrollForm.get('courseId')?.hasError('required')">
        Course ID is required
      </div>
  
      <div *ngIf="enrollForm.get('courseId')?.hasError('noCourseCode')">
        Course code starting with XX is not allowed.
      </div>
    </div>
  
    <br>
  
    <div>
      <label>Preferred Semester:</label><br>
      <select formControlName="preferredSemester">
        <option value="Odd">Odd</option>
        <option value="Even">Even</option>
      </select>
    </div>
  
    <br>
  
    <div>
      <input type="checkbox" formControlName="agreeToTerms">
      <label>I agree to the Terms and Conditions</label>
  
      <div *ngIf="enrollForm.get('agreeToTerms')?.touched &&
                  enrollForm.get('agreeToTerms')?.hasError('required')">
        You must agree before submitting
      </div>
    </div>
  
    <br>
  
    <h3>Additional Courses</h3>
  
    <button type="button" (click)="addCourse()">
      Add Another Course
    </button>
  
    <br><br>
  
    <div formArrayName="additionalCourses">
  
      <div *ngFor="let ctrl of additionalCourses.controls; let i = index">
  
        <input [formControl]="$any(ctrl)" placeholder="Course Name">
  
        <button type="button" (click)="removeCourse(i)">
          Remove
        </button>
  
        <br><br>
  
      </div>
  
    </div>
  
    <button type="submit" [disabled]="enrollForm.invalid">
      Submit
    </button>
  
    <button
      type="button"
      (click)="enrollForm.reset({
        preferredSemester: 'Odd',
        agreeToTerms: false
      });
      submitted = false;">
      Reset
    </button>
  
    <div *ngIf="submitted" style="color: green; margin-top: 15px;">
      Enrollment request submitted successfully!
    </div>
  
  </form>
